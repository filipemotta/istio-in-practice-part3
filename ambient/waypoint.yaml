# Waypoint for the payments-ambient namespace: an Envoy deployment managed by
# istiod that enforces L7 authorization (paths, methods, request principals)
# for the Services that opt in with the label istio.io/use-waypoint=waypoint.
# Created by step 01; the namespace label is added by step 07, so the first
# half of that step runs with ztunnel alone. Same output as
# `istioctl waypoint generate -n payments-ambient --for service`.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  labels:
    istio.io/waypoint-for: service
  name: waypoint
  namespace: payments-ambient
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
