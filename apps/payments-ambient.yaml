# Ambient-mode namespace: no sidecar. The node's ztunnel carries the traffic
# (mTLS over HBONE) and enforces L4 policy; the waypoint in ambient/ enforces
# L7 policy once the namespace opts in with istio.io/use-waypoint.
# Identities: spiffe://cluster.local/ns/payments-ambient/sa/<service account>.
apiVersion: v1
kind: Namespace
metadata:
  name: payments-ambient
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-api
  namespace: payments-ambient
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-check
  namespace: payments-ambient
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: risk-score
  namespace: payments-ambient
---
# payments-api is the caller of fraud-check and the backend of the ingress
# Gateway. The "app" container is curl standing in for the service code (it
# makes the outbound calls). The "load" container is fortio: its echo server
# on 9080 answers the requests that reach payments-api (through the Service
# below), and "fortio load" can be exec'd into it to generate traffic.
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: payments-ambient
spec:
  selector:
    app: payments-api
  ports:
  - name: http
    port: 8080
    targetPort: 9080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments-ambient
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        version: v1
    spec:
      serviceAccountName: payments-api
      containers:
      - name: app
        image: curlimages/curl:8.22.0
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
      - name: load
        image: fortio/fortio:1.75.3
        # fortio's image has no shell; "server" keeps the container running.
        args: ["server", "-http-port", "9080", "-grpc-port", "disabled", "-redirect-port", "disabled", "-tcp-port", "disabled", "-udp-port", "disabled"]
        ports:
        - containerPort: 9080
        readinessProbe:
          httpGet:
            path: /debug
            port: 9080
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
---
# fraud-check: fortio echo server, 2 replicas. Status and latency come from
# the query string (?status=403, ?delay=1s). -loglevel Verbose logs one JSON
# line per request, so the lab can count the requests that reached it.
# Port 8090 is fraud-check calling its own dependency, risk-score: fortio's
# multi-server proxy (-M) forwards the request to risk-score:8080 and returns
# its status. That makes fraud-check -> risk-score a real mesh call, made
# with fraud-check's identity.
apiVersion: v1
kind: Service
metadata:
  name: fraud-check
  namespace: payments-ambient
spec:
  selector:
    app: fraud-check
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: http-score
    port: 8090
    targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-check
  namespace: payments-ambient
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-check
  template:
    metadata:
      labels:
        app: fraud-check
        version: v1
    spec:
      serviceAccountName: fraud-check
      containers:
      - name: fortio
        image: fortio/fortio:1.75.3
        args: ["server", "-loglevel", "Verbose", "-M", "8090 http://risk-score:8080"]
        ports:
        - containerPort: 8080
        - containerPort: 8090
        readinessProbe:
          httpGet:
            path: /debug
            port: 8080
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
---
# risk-score: the dependency of fraud-check. Same fortio echo server.
apiVersion: v1
kind: Service
metadata:
  name: risk-score
  namespace: payments-ambient
spec:
  selector:
    app: risk-score
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-score
  namespace: payments-ambient
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-score
  template:
    metadata:
      labels:
        app: risk-score
        version: v1
    spec:
      serviceAccountName: risk-score
      containers:
      - name: fortio
        image: fortio/fortio:1.75.3
        args: ["server", "-loglevel", "Verbose"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /debug
            port: 8080
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
