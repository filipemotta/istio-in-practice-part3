# Meant as "allow payments-api to call risk-score". The principal is written
# without the trust domain. Principals are matched against the whole
# identity "<trust domain>/ns/<namespace>/sa/<service account>", so this
# string never matches and the caller it names stays denied.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: risk-score-allow-payments-api
  namespace: payments
spec:
  selector:
    matchLabels:
      app: risk-score
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["ns/payments/sa/payments-api"]
