# The edge of the payments platform: a Gateway API Gateway that istiod turns
# into an Envoy Deployment + Service named payments-gateway-istio (in this
# namespace, with the ServiceAccount payments-gateway-istio, so its mesh
# identity is cluster.local/ns/payments-ingress/sa/payments-gateway-istio).
# In kind there is no load balancer: the ConfigMap below makes the generated
# Service a ClusterIP, and the lab calls it from inside the cluster.
# The HTTPS listener (port 443) is added by ingress/gateway-https.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: payments-ingress
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-gateway-options
  namespace: payments-ingress
data:
  service: |
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: payments-gateway
  namespace: payments-ingress
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: payments-gateway-options
  listeners:
  - name: http
    hostname: api.payments.example
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: payments
