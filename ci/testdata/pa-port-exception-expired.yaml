# The port exception with an expiry date that has passed.
# Used by ci/test-security-lint.sh.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: fraud-check-legacy-port
  namespace: payments
  annotations:
    exception.istio-in-practice/owner: team-payments
    exception.istio-in-practice/expires: "2026-01-01"
spec:
  selector:
    matchLabels:
      app: fraud-check
  mtls:
    mode: STRICT
  portLevelMtls:
    8090:
      mode: PERMISSIVE
