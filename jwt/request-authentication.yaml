# Validate end-user JWTs at the edge. Attached to the Gateway with targetRefs
# (selector and targetRefs are mutually exclusive). The issuer must match the
# token's "iss"; the keys are an inline JWKS.
# The jwks value below is a placeholder: scripts/05-jwt.sh replaces it with
# the public key generated by tools/gen-jwt.sh (out/jwt/jwks.json) before
# applying, so no key material lives in the repository. In production you
# would point jwksUri at your identity provider instead.
# On its own this resource rejects invalid tokens but ACCEPTS requests with
# no token at all; jwt/require-jwt.yaml closes that.
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: payments-jwt
  namespace: payments-ingress
spec:
  targetRefs:
  - kind: Gateway
    group: gateway.networking.k8s.io
    name: payments-gateway
  jwtRules:
  - issuer: "https://issuer.payments.example"
    audiences: ["payments-api"]
    jwks: '{"keys":[]}'
